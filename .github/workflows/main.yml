name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        run: |
          if ls *.zip >/dev/null 2>&1; then
            unzip -q -o "$(ls *.zip | head -n 1)" -d project
          else
            ln -s "$PWD" project
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk EXTRA_NEYZISl_HUB.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EXTRA_NEYZISl_HUB
          path: EXTRA_NEYZISl_HUB.apk
